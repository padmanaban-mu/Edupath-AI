<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPath AI | Career Architect Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #3b82f6;
            --dark-blue: #1e293b;
            --bg-light: #f8fafc;
            --white: #ffffff;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            height: 90vh;
            margin: 20px auto;
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }

        .chat-header {
            background: var(--primary-blue);
            padding: 25px;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-header i { font-size: 1.5rem; }

        #chat-messages {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .bot-msg {
            align-self: flex-start;
            background: #f1f5f9;
            color: var(--dark-blue);
            padding: 15px 20px;
            border-radius: 18px 18px 18px 4px;
            max-width: 75%;
            line-height: 1.6;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
        }

        .user-msg {
            align-self: flex-end;
            background: var(--primary-blue);
            color: white;
            padding: 12px 20px;
            border-radius: 18px 18px 4px 18px;
            max-width: 70%;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
        }

        .options-wrapper {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .chat-btn {
            padding: 10px 18px;
            border-radius: 12px;
            border: 1px solid var(--primary-blue);
            background: white;
            color: var(--primary-blue);
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }

        .chat-btn:hover {
            background: var(--primary-blue);
            color: white;
        }

        .chat-footer {
            padding: 20px 30px;
            border-top: 1px solid #e2e8f0;
            background: #fdfdfd;
            display: none;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            font-size: 1rem;
        }

        #finalConfirmBtn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <i class="fas fa-robot"></i>
        <div>
            <h3 style="margin: 0;">EduPath AI Architect</h3>
            <p style="margin: 0; font-size: 0.8rem; opacity: 0.9;">Career Navigator & Learning Hub</p>
        </div>
    </div>

    <div id="chat-messages">
        <div class="bot-msg">
            Welcome to **EduPath AI**! I am your personal Career Architect.
            <br><br>
            To build your custom learning path, please select a domain:
            <div class="options-wrapper">
                <button onclick="collectData('domain', 'dataAnalyst')" class="chat-btn">Data Analyst</button>
                <button onclick="collectData('domain', 'aiml')" class="chat-btn">AI/ML Engineer</button>
            </div>
        </div>
    </div>

    <div class="chat-footer" id="chat-footer">
        <div class="input-group">
            <input type="text" id="confirmInput" placeholder="Type 'confirm' to sync roadmap...">
            <button id="finalConfirmBtn">Initialize Path</button>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    const API_URL = "http://localhost:3000";
    let userSelection = { domain: '', level: '', prereq: '' };

    const roadmapData = {
        dataAnalyst: {
            nonProgramming: [
                { id: "df", title: "Data Fundamentals", level: 1, prereq: [], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/9953/9953334.png", color: "#3b82f6" },
                { id: "stats", title: "Statistics", level: 2, prereq: ["df"], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/2103/2103633.png", color: "#8b5cf6" },
                { id: "excel", title: "Excel Analytics", level: 2, prereq: ["df"], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/732/732220.png", color: "#10b981" },
                { id: "eda", title: "Exploratory DA (EDA)", level: 5, prereq: ["stats", "pandas"], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/4245/4245351.png", color: "#f59e0b" },
                { id: "bi", title: "BI Tools (PBI/Tableau)", level: 5, prereq: ["excel", "eda"], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/5956/5956597.png", color: "#ec4899" }
            ],
            programming: [
                { id: "sql_a", title: "SQL Basics and Advanced", level: 3, prereq: ["df"], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/4492/4492311.png", color: "#2563eb" },
                { id: "py_b", title: "Python Basics", level: 4, prereq: ["df"], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/5968/5968350.png", color: "#f59e0b" },
                { id: "numpy", title: "NumPy Arrays", level: 4, prereq: ["py_b"], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/9135/9135965.png", color: "#ef4444" },
                { id: "pandas", title: "Pandas DataFrames", level: 4, prereq: ["numpy"], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/4862/4862036.png", color: "#10b981" },
                { id: "viz_py", title: "Python Viz", level: 5, prereq: ["pandas"], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/1055/1055644.png", color: "#6366f1" },
                { id: "reg", title: "Regression Models", level: 6, prereq: ["stats", "py_b"], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/2103/2103507.png", color: "#ef4444" }
            ],
            levels: [
                { lv: 1, name: "Data Foundations", icon: "fa-database" },
                { lv: 2, name: "Statistical Analysis", icon: "fa-chart-line" },
                { lv: 3, name: "Database & SQL", icon: "fa-server" },
                { lv: 4, name: "Python Engineering", icon: "fa-brands fa-python" },
                { lv: 5, name: "Visual Analytics", icon: "fa-pie-chart" },
                { lv: 6, name: "Advanced Modeling", icon: "fa-brain" }
            ]
        },
        aiml: {
            nonProgramming: [
                { id: "math_la", title: "Linear Algebra", level: 1, prereq: [], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/3721/3721619.png", color: "#3b82f6" },
                { id: "calc_mv", title: "Multivariable Calculus", level: 1, prereq: ["math_la"], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/2103/2103633.png", color: "#8b5cf6" },
                { id: "prob_inf", title: "Probability & Inference", level: 2, prereq: ["math_la"], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/1611/1611179.png", color: "#10b981" },
                { id: "opt_algo", title: "Optimization Theory", level: 3, prereq: ["calc_mv"], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/2540/2540832.png", color: "#f59e0b" },
                { id: "ethics_ai", title: "AI Ethics & Bias", level: 6, prereq: [], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/1162/1162456.png", color: "#ec4899" }
            ],
            programming: [
                { id: "skl_ml", title: "Scikit-Learn ML", level: 3, prereq: ["math_la"], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/2103/2103507.png", color: "#2563eb" },
                { id: "dl_nn", title: "Neural Networks", level: 4, prereq: ["skl_ml"], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/2103/2103831.png", color: "#f59e0b" },
                { id: "tf_torch", title: "PyTorch/TF", level: 4, prereq: ["dl_nn"], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/5968/5968350.png", color: "#ef4444" },
                { id: "nlp_proc", title: "NLP & Transformers", level: 5, prereq: ["dl_nn"], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/8637/8637099.png", color: "#10b981" },
                { id: "cv_vision", title: "Computer Vision", level: 5, prereq: ["dl_nn"], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/2892/2892305.png", color: "#6366f1" },
                { id: "mlo_ops", title: "MLOps Deployment", level: 6, prereq: ["tf_torch"], progress: 0, img: "https://cdn-icons-png.flaticon.com/512/9135/9135965.png", color: "#ef4444" }
            ],
            levels: [
                { lv: 1, name: "Math Foundations", icon: "fa-square-root-variable" },
                { lv: 2, name: "Statistical Theory", icon: "fa-chart-area" },
                { lv: 3, name: "Classical ML", icon: "fa-microchip" },
                { lv: 4, name: "Deep Learning", icon: "fa-network-wired" },
                { lv: 5, name: "Applied AI", icon: "fa-eye" },
                { lv: 6, name: "Ethics & Ops", icon: "fa-gears" }
            ]
        }
    };

    function appendMsg(text, type = 'bot') {
        const msgDiv = document.createElement('div');
        msgDiv.className = type === 'bot' ? 'bot-msg' : 'user-msg';
        msgDiv.innerHTML = text;
        const container = document.getElementById('chat-messages');
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    window.collectData = (type, value) => {
        appendMsg(value.toUpperCase(), 'user');
        userSelection[type] = value;

        setTimeout(() => {
            if (type === 'domain') {
                appendMsg(`Excellent choice! What is your current knowledge level in <b>${value}</b>?
                    <div class="options-wrapper">
                        <button onclick="collectData('level', 'Beginner')" class="chat-btn">Beginner</button>
                        <button onclick="collectData('level', 'Intermediate')" class="chat-btn">Intermediate</button>
                        <button onclick="collectData('level', 'Topper')" class="chat-btn">Topper</button>
                    </div>`);
            } else if (type === 'level') {
                appendMsg(`Got it. Do you have any experience with <b>Python</b> or <b>Statistics</b>?
                    <div class="options-wrapper">
                        <button onclick="collectData('prereq', 'Yes')" class="chat-btn">Yes, I know basics</button>
                        <button onclick="collectData('prereq', 'No')" class="chat-btn">No, start from scratch</button>
                    </div>`);
            } else if (type === 'prereq') {
                document.getElementById('chat-footer').style.display = 'block';
                appendMsg(`I've architected your <b>${userSelection.domain}</b> journey. <br><br>Please type <b>'confirm'</b> and click the button to generate your roadmap.`);
            }
        }, 800);
    };

    document.getElementById('finalConfirmBtn').onclick = async () => {
        const input = document.getElementById('confirmInput').value.toLowerCase();
        const btn = document.getElementById('finalConfirmBtn');
        
        if (input === 'confirm') {
            btn.disabled = true;
            btn.innerText = "Generating...";

            const finalRoadmap = JSON.parse(JSON.stringify(roadmapData));
            const domain = userSelection.domain;

            // Smart Auto-completion logic based on level
            if (userSelection.level === 'Topper' || userSelection.level === 'Intermediate') {
                if (finalRoadmap[domain].nonProgramming.length > 0) {
                    finalRoadmap[domain].nonProgramming[0].progress = 100;
                }
            }

            const initialData = {
                hasGeneratedRoadmap: true,
                selectedDomain: userSelection.domain,
                roadmapData: finalRoadmap
            };

            try {
                const response = await fetch(`${API_URL}/save-roadmap`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`, 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify(initialData)
                });

                if (response.ok) {
                    appendMsg("✨ Roadmap synchronized! Redirecting you now...", 'bot');
                    setTimeout(() => window.location.href = "roadmap.html", 1000);
                } else {
                    throw new Error("Failed to save");
                }
            } catch (err) {
                console.error("Save failed", err);
                btn.disabled = false;
                btn.innerText = "Initialize Path";
                appendMsg("❌ Error saving your roadmap. Please ensure your backend is running.", 'bot');
            }
        } else {
            alert("Please type 'confirm' exactly to proceed.");
        }
    };
</script>

</body>
</html>
