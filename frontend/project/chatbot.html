<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPath AI | Career Architect Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #3b82f6;
            --dark-blue: #1e293b;
            --bg-light: #f8fafc;
            --white: #ffffff;
            --text-muted: #64748b;
            --success-green: #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            height: 90vh;
            margin: 20px auto;
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }

        .chat-header {
            background: var(--primary-blue);
            padding: 25px;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-header i { font-size: 1.5rem; }

        #chat-messages {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .bot-msg {
            align-self: flex-start;
            background: #f1f5f9;
            color: var(--dark-blue);
            padding: 15px 20px;
            border-radius: 18px 18px 18px 4px;
            max-width: 85%;
            line-height: 1.6;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
        }

        .user-msg {
            align-self: flex-end;
            background: var(--primary-blue);
            color: white;
            padding: 12px 20px;
            border-radius: 18px 18px 4px 18px;
            max-width: 70%;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
        }

        .options-wrapper {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .chat-btn {
            padding: 10px 18px;
            border-radius: 12px;
            border: 1px solid var(--primary-blue);
            background: white;
            color: var(--primary-blue);
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }

        .chat-btn:hover {
            background: var(--primary-blue);
            color: white;
        }

        /* Form Styles for Checklist */
        .checklist-form {
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .checklist-section {
            margin-bottom: 15px;
        }
        
        .checklist-section h4 {
            margin: 0 0 10px 0;
            color: var(--primary-blue);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .none-option {
            background: #fffbeb;
            border: 1px solid #fde68a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #b45309;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .submit-checklist-btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .chat-footer {
            padding: 20px 30px;
            border-top: 1px solid #e2e8f0;
            background: #fdfdfd;
            display: none;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            font-size: 1rem;
        }

        #finalConfirmBtn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <i class="fas fa-robot"></i>
        <div>
            <h3 style="margin: 0;">EduPath AI Architect</h3>
            <p style="margin: 0; font-size: 0.8rem; opacity: 0.9;">Career Navigator & Learning Hub</p>
        </div>
    </div>

    <div id="chat-messages">
        <div class="bot-msg">
            Welcome to **EduPath AI**! I am your personal Career Architect.
            <br><br>
            To build your custom learning path, please select a domain:
            <div class="options-wrapper">
                <button onclick="selectDomain('dataAnalyst', 'Data Analyst')" class="chat-btn">Data Analyst</button>
                <button onclick="selectDomain('aiml', 'AI/ML Engineer')" class="chat-btn">AI/ML Engineer</button>
            </div>
        </div>
    </div>

    <div class="chat-footer" id="chat-footer">
        <div class="input-group">
            <input type="text" id="confirmInput" placeholder="Type 'confirm' to sync roadmap...">
            <button id="finalConfirmBtn">Initialize Path</button>
        </div>
    </div>
</div>

<script src="js/courseData.js"></script>
<script src="js/courseData.js"></script>
<script>
    const token = localStorage.getItem('token');
    const API_URL = "http://localhost:3000";
    let userSelection = { domain: '' };
    
    // We create a deep copy of the global roadmap data to modify it for this specific user
    let userRoadmap = JSON.parse(JSON.stringify(window.roadmapData));

    function appendMsg(text, type = 'bot') {
        const msgDiv = document.createElement('div');
        msgDiv.className = type === 'bot' ? 'bot-msg' : 'user-msg';
        msgDiv.innerHTML = text;
        const container = document.getElementById('chat-messages');
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    // STEP 1: Select Domain & Generate Checklist
    window.selectDomain = (domainKey, domainName) => {
        appendMsg(domainName, 'user');
        userSelection.domain = domainKey;
        
        const domainData = userRoadmap[domainKey];

        setTimeout(() => {
            // Generate dynamic checklist from courseData.js
            let formHTML = `
                <div class="checklist-form">
                    <p style="margin-top:0;">Please check any courses you have <b>already completed</b>, or select "None" if you are starting fresh:</p>
                    
                    <label class="none-option">
                        <input type="checkbox" id="check-none" onchange="toggleNone(this)">
                        NONE (I am a complete beginner)
                    </label>

                    <div class="checklist-section">
                        <h4>Programming Courses</h4>
                        <div class="checkbox-grid">
                            ${domainData.programming.map(c => `
                                <label class="checkbox-item course-cb">
                                    <input type="checkbox" value="${c.id}" data-title="${c.title}"> ${c.title}
                                </label>
                            `).join('')}
                        </div>
                    </div>

                    <div class="checklist-section">
                        <h4>Non-Programming Courses</h4>
                        <div class="checkbox-grid">
                            ${domainData.nonProgramming.map(c => `
                                <label class="checkbox-item course-cb">
                                    <input type="checkbox" value="${c.id}" data-title="${c.title}"> ${c.title}
                                </label>
                            `).join('')}
                        </div>
                    </div>
                    <button class="submit-checklist-btn" onclick="processChecklist()">Submit Assessment</button>
                </div>
            `;
            appendMsg(formHTML);
        }, 600);
    };

    // Logic to disable other checkboxes if "None" is checked
    window.toggleNone = (noneCheckbox) => {
        const allCourseCheckboxes = document.querySelectorAll('.course-cb input');
        allCourseCheckboxes.forEach(cb => {
            if (noneCheckbox.checked) {
                cb.checked = false;
                cb.disabled = true;
            } else {
                cb.disabled = false;
            }
        });
    };

    // STEP 2: Process the Checklist & Smart Suggestions
    window.processChecklist = () => {
        const isNone = document.getElementById('check-none').checked;
        const checkedCourses = Array.from(document.querySelectorAll('.course-cb input:checked'));
        
        // Disable the form so they can't submit twice
        document.querySelector('.submit-checklist-btn').disabled = true;
        document.querySelector('.submit-checklist-btn').innerText = "Submitted";

        if (isNone) {
            appendMsg("None. I am a beginner.", 'user');
            setTimeout(() => {
                appendMsg(`Perfect. I have set up a complete beginner path for you. We will start with the foundational modules. <br><br>Please type <b>'confirm'</b> below to initialize your roadmap.`);
                document.getElementById('chat-footer').style.display = 'block';
            }, 800);
        } else if (checkedCourses.length > 0) {
            let userTitles = checkedCourses.map(cb => cb.getAttribute('data-title')).join(', ');
            appendMsg(`I have completed: ${userTitles}`, 'user');
            
            // Unlock checked courses and find important topics to review
            let reviewTopics = [];
            let domainData = userRoadmap[userSelection.domain];
            let allDomainCourses = [...domainData.programming, ...domainData.nonProgramming];

            checkedCourses.forEach(cb => {
                let courseId = cb.value;
                // Find course in our userRoadmap and set progress to 100
                let courseObj = allDomainCourses.find(c => c.id === courseId);
                if (courseObj) {
                    courseObj.progress = 100;
                    // Pick the first keyTopic to recommend reviewing
                    if (courseObj.keyTopics && courseObj.keyTopics.length > 0) {
                        reviewTopics.push(`<b>${courseObj.keyTopics[0]}</b> (from ${courseObj.title})`);
                    }
                }
            });

            setTimeout(() => {
                let botReply = `Got it! I have marked those courses as complete, which will automatically unlock the next level of courses for you (like Pandas or Advanced Stats).<br><br>`;
                
                if (reviewTopics.length > 0) {
                    botReply += `⚠️ <b>AI Recommendation:</b> Even though you know these subjects, before starting the new courses, please ensure you have absolute clarity on these specific topics from our curriculum:<br>
                    <ul style="margin-top: 5px;"><li>${reviewTopics.join('</li><li>')}</li></ul><br>`;
                }
                
                botReply += `If you are ready, type <b>'confirm'</b> below to initialize your roadmap.`;
                appendMsg(botReply);
                document.getElementById('chat-footer').style.display = 'block';
            }, 800);

        } else {
            alert("Please select at least one course or check 'None'.");
            document.querySelector('.submit-checklist-btn').disabled = false;
            document.querySelector('.submit-checklist-btn').innerText = "Submit Assessment";
        }
    };

    // STEP 3: Save to Database
    document.getElementById('finalConfirmBtn').onclick = async () => {
        const input = document.getElementById('confirmInput').value.toLowerCase().trim();
        const btn = document.getElementById('finalConfirmBtn');
        
        if (input === 'confirm') {
            btn.disabled = true;
            btn.innerText = "Generating...";

            const finalDataToSave = {
                hasGeneratedRoadmap: true,
                selectedDomain: userSelection.domain,
                roadmapData: userRoadmap
            };

            try {
                const response = await fetch(`${API_URL}/save-roadmap`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`, 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify(finalDataToSave)
                });

                if (response.ok) {
                    appendMsg("✨ Roadmap synchronized! Redirecting you to your personalized path...", 'bot');
                    setTimeout(() => window.location.href = "roadmap.html", 1500);
                } else {
                    throw new Error("Failed to save");
                }
            } catch (err) {
                console.error("Save failed", err);
                btn.disabled = false;
                btn.innerText = "Initialize Path";
                appendMsg("❌ Error saving your roadmap. Please ensure your backend server is running.", 'bot');
            }
        } else {
            alert("Please type 'confirm' exactly to proceed.");
        }
    };
</script>

</body>
</html>
