<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - EduPath AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #2d6cdf;
            --dark-blue: #1a3a6d;
            --hero-gradient: linear-gradient(135deg, #1a3a6d 0%, #2d6cdf 100%);
            --light-bg: #f4f8ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--light-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background: #fff;
            width: 900px;
            max-width: 95%;
            height: 600px;
            display: flex;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .login-left {
            flex: 1;
            background: var(--hero-gradient);
            padding: 60px;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .login-left h1 { font-size: 2.5rem; margin-bottom: 20px; }
        .login-left p { font-size: 1.1rem; opacity: 0.9; line-height: 1.6; }

        .login-right {
            flex: 1.2;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-header { margin-bottom: 40px; }
        .login-header h2 { font-size: 2rem; color: var(--dark-blue); }

        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #555; }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 1rem;
            transition: 0.3s;
        }
        .form-group input:focus { border-color: var(--primary-blue); outline: none; }

        .btn-signin {
            width: 100%;
            padding: 15px;
            background: var(--primary-blue);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-signin:hover { background: var(--dark-blue); transform: translateY(-2px); }

        .footer-links { margin-top: 30px; text-align: center; font-size: 0.9rem; }
        .footer-links a { color: var(--primary-blue); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-left">
            <h1>Welcome Back!</h1>
            <p>Continue your personalized learning journey with EduPath AI.</p>
        </div>
        <div class="login-right">
            <div class="login-header">
                <h2>Sign In</h2>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-signin" id="signinBtn">Sign In</button>
            </form>
            <div class="footer-links">
                <p>Don't have an account? <a href="signup.html">Create Account</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('signinBtn');
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    btn.innerText = 'Signing In...';

    try {
        const response = await fetch('http://localhost:3000/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await response.json();
        console.log("user information",data)
        if (response.ok) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('username', data.username); 
            window.location.href = 'dashboard.html';
        } else {
            alert(data.error);
        }
    } catch (err) {
        alert("Server connection failed.");
    } finally {
        btn.innerText = 'Sign In';
    }
});
    </script>
</body>
</html>
