<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - EduPath AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #2d6cdf;
            --dark-blue: #1a3a6d;
            --hero-gradient: linear-gradient(135deg, #1a3a6d 0%, #2d6cdf 100%);
            --light-bg: #f4f8ff;
        }

        body {
            background-color: var(--light-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            margin: 0;
        }

        .profile-card {
            background: #fff;
            width: 450px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .profile-card h2 {
            text-align: center;
            color: var(--dark-blue);
            margin-bottom: 30px;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #555; }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 1rem;
        }

        .btn-update {
            width: 100%;
            padding: 14px;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <h2>Profile Settings</h2>
        <form id="updateProfileForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullname" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>
            <button type="submit" class="btn-update" id="updateBtn">Update Account</button>
        </form>
        <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        // 1. Fetch current details to pre-fill the form
        window.onload = async () => {
            try {
                const response = await fetch('http://localhost:3000/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('fullname').value = data.fullName;
                    document.getElementById('username').value = data.username;
                    document.getElementById('email').value = data.email;
                }
            } catch (err) {
                alert("Failed to connect to database.");
            }
        };

        // 2. Handle the Update
        document.getElementById('updateProfileForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('updateBtn');
            const newUsername = document.getElementById('username').value;
            
            const payload = {
                fullName: document.getElementById('fullname').value,
                username: newUsername,
                email: document.getElementById('email').value
            };

            btn.innerText = 'Updating...';

            try {
                const response = await fetch('http://localhost:3000/update-profile', {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    localStorage.setItem('username', newUsername); // Update local cache
                    alert("Profile updated successfully!");
                    window.location.href = 'dashboard.html';
                } else {
                    alert("Failed to update data.");
                }
            } catch (err) {
                alert("Server error.");
            } finally {
                btn.innerText = 'Update Account';
            }
        });
    </script>
</body>
</html>
