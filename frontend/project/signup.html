<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - EduPath AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #2d6cdf;
            --dark-blue: #1a3a6d;
            --hero-gradient: linear-gradient(135deg, #1a3a6d 0%, #2d6cdf 100%);
            --light-bg: #f4f8ff;
        }

        body {
            background-color: var(--light-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            margin: 0;
        }

        .signup-card {
            background: #fff;
            width: 450px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .signup-header { text-align: center; margin-bottom: 30px; }
        .signup-header h2 { color: var(--dark-blue); font-size: 1.8rem; margin: 0; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #555; }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .btn-signup {
            width: 100%;
            padding: 14px;
            background: var(--primary-blue);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-signup:hover { background: var(--dark-blue); }

        /* --- NEW ADDITION FOR LOGIN LINK --- */
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.95rem;
            color: #555;
        }
        
        .login-link a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: var(--dark-blue);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="signup-card">
        <div class="signup-header">
            <h2>Join EduPath AI</h2>
        </div>
        <form id="signupForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullname" placeholder="Enter full name" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create password" required>
            </div>
            <button type="submit" class="btn-signup" id="signupBtn">Register</button>
        </form>

        <p class="login-link">Already have an account? <a href="login.html">Login here</a></p>
    </div>

    <script>
      document.getElementById('signupForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('signupBtn');
    const payload = {
        fullName: document.getElementById('fullname').value,
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
    };

    btn.innerText = 'Creating Account...';

    try {
        console.log("payload",payload)
        const response = await fetch('http://localhost:3000/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            alert("Account created! Redirecting to login...");
            window.location.href = 'login.html';
        } else {
            const data = await response.json();
            alert(data.error || "Signup failed");
        }
    } catch (err) {
        alert("Server error.");
    } finally {
        btn.innerText = 'Register';
    }
});
    </script>
</body>
</html>
